name: stock-bot keepalive

# 盤前/盤中/盤後的自動推播已經關閉（改成 LINE 聊天室打股票代號即時查詢）。
# 這個 workflow 現在只做兩件事：
# 1. 全年無休、一天 24 小時每 10 分鐘 ping 一次，讓 Render 免費方案不要休眠。
#    原本只設定平日白天，是舊版「只有排程推播時間才需要醒著」的邏輯；
#    現在改成隨時都可能在 LINE 問股票（晚上、假日都算），伺服器隨時都要醒著，
#    不然 LINE 傳訊息過來、或 LINE 後台按 Verify 測連線，會因為冷啟動要等
#    40~50 秒而逾時失敗（這正是「打了沒反應」的真正原因，不是設定錯）。
#    是公開 repo，GitHub Actions 分鐘數不限，全天候 ping 不會花錢。
# 2. 保留 workflow_dispatch 手動觸發選項，之後如果想手動補推一次整批分析，
#    還是可以人工跑一次（平常不會自動執行）。
on:
  schedule:
    - cron: "*/10 * * * *"  # 每 10 分鐘 ping 一次，全天候、不分平日假日
  workflow_dispatch:
    inputs:
      slot:
        description: "選填，手動補推播用：premarket / midday / afterhours，留空只是喚醒服務"
        required: false
        default: ""

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: 判斷這次要做什麼
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.slot }}" ]; then
            echo "slot=${{ github.event.inputs.slot }}" >> "$GITHUB_OUTPUT"
            echo "mode=trigger" >> "$GITHUB_OUTPUT"
          else
            echo "mode=keepalive" >> "$GITHUB_OUTPUT"
          fi

      - name: 先確認伺服器已醒來（手動觸發時才需要，keep-alive 本身就是在喚醒）
        if: steps.pick.outputs.mode == 'trigger'
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 15 "${{ secrets.RENDER_APP_URL }}/health" || echo "000")
            echo "第 $i 次檢查，狀態碼：$code"
            if [ "$code" = "200" ]; then
              echo "伺服器已就緒"
              exit 0
            fi
            sleep 5
          done
          echo "等待伺服器醒來逾時"
          exit 1

      - name: 手動觸發分析並推播到 LINE
        if: steps.pick.outputs.mode == 'trigger'
        run: |
          curl -sf -m 150 -X POST "${{ secrets.RENDER_APP_URL }}/trigger/${{ steps.pick.outputs.slot }}" \
            -H "X-Trigger-Secret: ${{ secrets.TRIGGER_SECRET }}"

      - name: 喚醒服務（避免休眠，這樣你在 LINE 問股票時才不用等冷啟動）
        if: steps.pick.outputs.mode == 'keepalive'
        run: curl -sf "${{ secrets.RENDER_APP_URL }}/health"
